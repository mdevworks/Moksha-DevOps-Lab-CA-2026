
name: PowerShell File Automation CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare test files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force Inbox | Out-Null
          Set-Content Inbox/TestDocument.txt "CI test document"
          Set-Content Inbox/TestNotes.txt "CI test notes"

      - name: Run file automation
        shell: powershell
        run: |
          ./Scripts/FileAutomation.ps1

      - name: Run automated tests
        shell: powershell
        run: |
          ./Scripts/Test-FileAutomation.ps1

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: mokshakj050704/powershell-file-automation:latest
