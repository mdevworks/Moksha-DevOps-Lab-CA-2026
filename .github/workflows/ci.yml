name: PowerShell File Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare test files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force Inbox | Out-Null
          Set-Content Inbox/TestDocument.txt "CI test document"
          Set-Content Inbox/TestNotes.txt "CI test notes"

      - name: Run file automation
        shell: powershell
        run: |
          ./Scripts/FileAutomation.ps1

      - name: Run automated tests
        shell: powershell
        run: |
          ./Scripts/Test-FileAutomation.ps1