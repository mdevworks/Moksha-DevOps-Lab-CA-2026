name: PowerShell File Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run automated tests
        shell: powershell
        run: |
          ./Scripts/Test-FileAutomation.ps1